[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fogos-triage"
version = "0.4.0"
description = "Triagem rápida de fogos para apoio à decisão ANEPC"
requires-python = ">=3.10"
dependencies = [
    "wildfire-ROS-models @ git+https://github.com/forefireAPI/wildfire_ROS_models.git",
]

[project.optional-dependencies]
landscape = ["rasterio>=1.3", "shapely>=2.0"]
weather = ["httpx>=0.24"]
db = ["asyncpg>=0.29"]
fogos = ["curl_cffi>=0.5", "httpx>=0.24"]
gee = ["earthengine-api>=0.1"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "asyncpg>=0.29", "pydantic>=2.0"]
full = [
    "rasterio>=1.3",
    "shapely>=2.0",
    "httpx>=0.24",
    "asyncpg>=0.29",
    "curl_cffi>=0.5",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
    "earthengine-api>=0.1",
]

[tool.setuptools.packages.find]
where = ["src"]
